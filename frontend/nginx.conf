server {
    listen       80;
    server_name  localhost;

    # 重定向返回相对路径，避免 $host 不含端口导致跳到 80 端口
    absolute_redirect off;

    # 根路径直接进前端；否则 / 会被转发到后端，返回 401 JSON
    location = / {
        return 302 /app/;
    }

    # SPA redirect: /app → /app/
    location = /app {
        return 302 /app/;
    }

    # 登录页刷新：直接返回 SPA，避免被代理到后端拿到 401 JSON
    location = /login {
        root      /usr/share/nginx/html;
        try_files /app/index.html =404;
    }

    # SPA 入口：每次回源，避免局域网设备缓存旧的 index.html
    location = /app/index.html {
        root      /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Vite 产物带内容 hash，可以长缓存；缺失文件返回 404，不回退到 index.html
    location /app/assets/ {
        root      /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Frontend static assets (Vite build with base=/app/)
    location /app/ {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri /app/index.html;
    }

    # Proxy all other requests (API + LangGraph SDK) to the backend
    location / {
        proxy_pass          http://backend:2024;
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;

        # SSE / streaming support (LangGraph uses Server-Sent Events)
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  300s;

        # WebSocket support
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         "upgrade";
    }

    # Gzip compression for static assets
    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_proxied     any;
    gzip_min_length  256;
}
