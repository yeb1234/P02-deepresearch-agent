name: zb02-deepresearch

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepresearch
    ports:
      - "12509:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deepresearch"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # langgraph-checkpoint-redis 需要 RediSearch（FT.* 命令），必须 Redis Stack
    image: docker.m.daocloud.io/redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    command: ["redis-stack-server", "--appendonly", "yes"]
    ports:
      - "12609:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "12409:2024"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:2024/api/models').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "12309:80"

  # ── 知识库（Milvus）────────────────────────────────────────────
  # 默认不启动；启用：docker compose --profile kb up -d
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: ["kb"]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd:/etcd

  minio:
    image: minio/minio:latest
    profiles: ["kb"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.2
    profiles: ["kb"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19509:19530"
    volumes:
      - milvus:/var/lib/milvus

volumes:
  pgdata:
  redisdata:
  etcd:
  minio:
  milvus:
